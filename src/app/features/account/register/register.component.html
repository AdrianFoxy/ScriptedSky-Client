<div class="container flex w-full max-w-6xl bg-white rounded-lg shadow-lg overflow-hidden">
    <div class="w-1/2 hidden md:block">
        <img src="identity.jpg" alt="" class="h-full w-full object-cover">
    </div>
    <div class="w-full md:w-1/2 p-8">
        <h2 class="text-2xl font-bold text-center text-gray-900">Register</h2>
        <p class="text-gray-600 text-center">Please fill your register information</p>
        <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="mt-6">
            <app-text-input label="First name" formControlName="firstName" />
            <app-text-input label="Last name" formControlName="lastName" />
            <app-text-input label="Email" formControlName="email"/>
            <app-text-input label="Password" formControlName="password" type="password"/>

            <button 
                [disabled]="registerForm.invalid"
                type="submit" 
                class="w-full bg-blue-600 text-white py-2 rounded-lg mt-4 hover:bg-blue-700 transition 
                    disabled:bg-gray-400 disabled:cursor-not-allowed disabled:opacity-50">
                Register
            </button>

            <p class="text-center text-gray-600 mt-4">Alredy have an account? <a routerLink="/account/login"  class="text-blue-600 hover:underline">Sign In</a></p>
        </form>
    </div>

</div>
