<div class="container flex w-full max-w-6xl bg-white rounded-lg shadow-lg overflow-hidden">
    <div class="w-1/2 hidden md:block">
        <img src="identity.jpg" alt="" class="h-full w-full object-cover">
    </div>
    <div class="w-full md:w-1/2 p-8">
        <h2 class="text-2xl font-bold text-center text-gray-900">Sign In</h2>
        <p class="text-gray-600 text-center">Please fill your email and password to login</p>
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="mt-6">
            <div>
                <label class="block text-gray-700">Email</label>
                <input formControlName="email" type="email" class="w-full px-4 py-2 mt-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Email">
            </div>
            <div class="mt-4">
                <label class="block text-gray-700">Password</label>
                <input formControlName="password" type="password" class="w-full px-4 py-2 mt-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Password">
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg mt-4 hover:bg-blue-700 transition">Login</button>
            <p class="text-center text-gray-600 mt-4">Don’t have an account? <a href="#" class="text-blue-600 hover:underline">Register</a></p>
        </form>
    </div>
</div>
