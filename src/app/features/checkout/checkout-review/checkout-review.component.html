<div class="mx-auto p-6 bg-white">
    <h4 class="text-xl font-bold text-gray-800 mb-4">
        Before confirming the order, check the correctness
    </h4>
    <hr class="mb-4 border-gray-200">
    <h5 class="text-lg font-semibold text-gray-700 mb-2">Delivery Method</h5>
    <span class="text-gray-600">{{cartService.selectedDelivery()?.shortName}}</span>
    <hr class="my-4 border-gray-200">
    <h5 class="text-lg font-semibold text-gray-700 mb-4">Order Items</h5>
    <div class="border-b border-gray-200">
        <table class="w-full text-center">
            <tbody class="divide-y divide-gray-200">
                @for (item of cartService.cart()?.items; track item.bookId) {
                    <tr class="hover:bg-gray-50 transition-colors">
                        <td class="py-4">
                            <div class="flex items-center gap-4">
                                <img src="{{item.pictureURL}}" alt="product image" class="w-14 h-22 rounded-lg shadow-sm">
                                <span class="text-gray-700 font-medium">{{item.bookName}}</span>
                            </div>
                        </td>
                        <td class="p-4 text-gray-600">x{{item.quantity}}</td>
                        <td class="p-4 text-right text-gray-800 font-semibold">{{item.price}}₴</td>
                    </tr>
                }
            </tbody>
        </table>
    </div>
</div>
