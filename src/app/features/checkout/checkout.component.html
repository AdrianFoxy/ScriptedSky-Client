<div class="container mx-auto py-6 px-4">
    <h1 class="all-product-subtitle mb-2 text-2xl font-bold">Shopping cart</h1>
    <hr>
    <div class="mx-auto px-6 md:flex md:space-x-6 xl:px-0 mt-2">
        <div class="w-full">
            <mat-stepper 
              #stapper class="bg-white border border-gray-200 shadow-lg rounded-xl"
              [linear]="true">
                <mat-step label="Shipping" [completed]="completionStatus().delivery">
                    <app-checkout-delivery (deliveryComplete)="handleDeliveryChange($event)"></app-checkout-delivery>
                    <hr class="mt-3">
                    <div class="mt-5 flex items-center justify-between gap-x-2">
                        <button routerLink="/cart" type="button" class="flex items-center rounded-md bg-blue-500 py-1.5 px-3 font-medium text-blue-50 hover:bg-blue-600">
                          <svg class="w-6 h-6 text-gray-800 dark:text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
                            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m15 19-7-7 7-7"/>
                          </svg>    
                          <span class="max-sm:hidden">Back to cart</span>
                        </button>
                        <button matStepperNext type="button" class="flex items-center rounded-md bg-blue-500 py-1.5 px-3 font-medium text-blue-50 hover:bg-blue-600">
                          <span class="max-sm:hidden">Next</span>
                          <svg class="w-6 h-6 text-gray-800 dark:text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
                            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m9 5 7 7-7 7" />
                          </svg>
                        </button>
                      </div>          
                </mat-step>
                <mat-step label="Confirmation">
                    <app-checkout-review></app-checkout-review>
                    <hr class="mt-3">
                    <div class="mt-5 flex items-center justify-between gap-x-2">
                        <button matStepperPrevious type="button" class="flex items-center rounded-md bg-blue-500 py-1.5 px-3 font-medium text-blue-50 hover:bg-blue-600">
                          <svg class="w-6 h-6 text-gray-800 dark:text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
                            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m15 19-7-7 7-7"/>
                          </svg>    
                          <span class="max-sm:hidden">Back</span>
                        </button>
                        <button type="button" class="flex items-center rounded-md bg-blue-500 py-1.5 px-3 font-medium text-blue-50 hover:bg-blue-600">
                          <span (click)="handleConfirmOrder()">Confirm Order</span>
                          <svg class="w-6 h-6 text-gray-800 dark:text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 24 24">
                            <path fill-rule="evenodd" d="M12 2c-.791 0-1.55.314-2.11.874l-.893.893a.985.985 0 0 1-.696.288H7.04A2.984 2.984 0 0 0 4.055 7.04v1.262a.986.986 0 0 1-.288.696l-.893.893a2.984 2.984 0 0 0 0 4.22l.893.893a.985.985 0 0 1 .288.696v1.262a2.984 2.984 0 0 0 2.984 2.984h1.262c.261 0 .512.104.696.288l.893.893a2.984 2.984 0 0 0 4.22 0l.893-.893a.985.985 0 0 1 .696-.288h1.262a2.984 2.984 0 0 0 2.984-2.984V15.7c0-.261.104-.512.288-.696l.893-.893a2.984 2.984 0 0 0 0-4.22l-.893-.893a.985.985 0 0 1-.288-.696V7.04a2.984 2.984 0 0 0-2.984-2.984h-1.262a.985.985 0 0 1-.696-.288l-.893-.893A2.984 2.984 0 0 0 12 2Zm3.683 7.73a1 1 0 1 0-1.414-1.413l-4.253 4.253-1.277-1.277a1 1 0 0 0-1.415 1.414l1.985 1.984a1 1 0 0 0 1.414 0l4.96-4.96Z" clip-rule="evenodd"/>
                          </svg>                          
                        </button>
                      </div>          
                </mat-step>
            </mat-stepper> 
            <pre>{{completionStatus() | json}}</pre>         
        </div>

        <div class="md:w-1/3">
            <app-order-summary></app-order-summary>
        </div>

    </div>
</div>
